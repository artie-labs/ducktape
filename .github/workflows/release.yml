name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must be a semver tag, e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # goreleaser needs full history + tags for the changelog and version.
          fetch-depth: 0

      # Required so buildx can build the linux/arm64 image on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # make release builds with skip_push and then `docker push`es from the host,
      # so the runner's docker daemon must be authenticated to Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag and push
        run: |
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release
